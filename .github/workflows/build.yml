name: Build Offline Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        run: |
          set -euo pipefail
          ARCHIVE="OfflineChat-Android-Project.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE was not found in the repository root."
            echo "Upload the project ZIP to the top level of your GitHub repository, then run this workflow again."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/offline-chat-project"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/offline-chat-project"

          if [ ! -f "$RUNNER_TEMP/offline-chat-project/settings.gradle" ] || \
             [ ! -f "$RUNNER_TEMP/offline-chat-project/app/build.gradle" ]; then
            echo "ERROR: The ZIP does not contain the expected Android project files at its root."
            find "$RUNNER_TEMP/offline-chat-project" -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          cp -a "$RUNNER_TEMP/offline-chat-project/." "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" offline-chat.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Chat-APK
          path: offline-chat.apk
          if-no-files-found: error
          retention-days: 14
